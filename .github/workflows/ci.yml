name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check app imports correctly
        run: python -c "import app"
        env:
          JWT_SECRET_KEY: test-secret
          DB_HOST: localhost
          DB_USER: root
          DB_PASSWORD: password
          DB_NAME: testdb
          DB_PORT: 3306
