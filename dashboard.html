<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CourseFlow â€" Dashboard</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .qa-btn svg { width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0; }
  .dash-course-icon svg { width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }

  /* â"€â"€ ADMIN HERO BANNER â"€â"€ */
  .admin-hero {
    background: linear-gradient(135deg, #0d1424 0%, #1e3a5f 50%, #1d4ed8 100%);
    border-radius: var(--radius-lg);
    padding: 32px 36px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    position: relative;
    overflow: hidden;
  }
  .admin-hero::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(37,99,235,0.18);
    pointer-events: none;
  }
  .admin-hero::after {
    content: '';
    position: absolute;
    bottom: -80px; right: 120px;
    width: 200px; height: 200px;
    border-radius: 50%;
    background: rgba(255,255,255,0.04);
    pointer-events: none;
  }
  .admin-hero-text { position: relative; z-index: 1; }
  .admin-hero-eyebrow {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }
  .admin-hero-title {
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.6px;
    line-height: 1.2;
    margin-bottom: 8px;
  }
  .admin-hero-sub {
    font-size: 14px;
    color: rgba(255,255,255,0.55);
  }
  .admin-hero-actions { display: flex; gap: 10px; flex-shrink: 0; position: relative; z-index: 1; }
  .admin-hero-btn {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px; font-weight: 600;
    cursor: pointer; text-decoration: none;
    border: none; transition: all 0.15s;
  }
  .admin-hero-btn.primary { background: #2563eb; color: #fff; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
  .admin-hero-btn.primary:hover { background: #1d4ed8; transform: translateY(-1px); }
  .admin-hero-btn.secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
  .admin-hero-btn.secondary:hover { background: rgba(255,255,255,0.18); }
  .admin-hero-btn svg { width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }

  /* â"€â"€ ADMIN STAT CARDS â"€â"€ */
  .admin-stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .admin-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 14px;
    transition: box-shadow 0.2s, transform 0.15s;
    position: relative;
    overflow: hidden;
  }
  .admin-stat:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
  .admin-stat-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .admin-stat-label { font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .admin-stat-icon {
    width: 38px; height: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .admin-stat-icon svg { width:18px;height:18px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none; }
  .admin-stat-icon.blue   { background: var(--blue-light);   } .admin-stat-icon.blue   svg { stroke: var(--blue); }
  .admin-stat-icon.green  { background: var(--green-light);  } .admin-stat-icon.green  svg { stroke: var(--green); }
  .admin-stat-icon.purple { background: var(--purple-light); } .admin-stat-icon.purple svg { stroke: var(--purple); }
  .admin-stat-icon.amber  { background: var(--amber-light);  } .admin-stat-icon.amber  svg { stroke: var(--amber); }
  .admin-stat-value { font-size: 32px; font-weight: 800; letter-spacing: -1.5px; line-height: 1; color: var(--text); }
  .admin-stat-sub { font-size: 12px; color: var(--text-muted); }
  .admin-stat-accent {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 3px;
  }
  .admin-stat-accent.blue   { background: linear-gradient(90deg, var(--blue), #60a5fa); }
  .admin-stat-accent.green  { background: linear-gradient(90deg, var(--green), #4ade80); }
  .admin-stat-accent.purple { background: linear-gradient(90deg, var(--purple), #a78bfa); }
  .admin-stat-accent.amber  { background: linear-gradient(90deg, var(--amber), #fbbf24); }

  /* â"€â"€ ADMIN QUICK ACTIONS â"€â"€ */
  .admin-actions-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .admin-action-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    display: flex; flex-direction: column; gap: 10px;
    text-decoration: none;
    transition: all 0.15s;
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  .admin-action-card:hover { border-color: var(--blue); box-shadow: 0 4px 16px rgba(37,99,235,0.1); transform: translateY(-2px); }
  .admin-action-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .admin-action-icon svg { width:18px;height:18px;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none; }
  .admin-action-icon.blue   { background: var(--blue-light);   } .admin-action-icon.blue   svg { stroke: var(--blue); }
  .admin-action-icon.green  { background: var(--green-light);  } .admin-action-icon.green  svg { stroke: var(--green); }
  .admin-action-icon.purple { background: var(--purple-light); } .admin-action-icon.purple svg { stroke: var(--purple); }
  .admin-action-icon.amber  { background: var(--amber-light);  } .admin-action-icon.amber  svg { stroke: var(--amber); }
  .admin-action-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .admin-action-desc  { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

  /* â"€â"€ TWO COLUMN LAYOUT â"€â"€ */
  .dash-two-col { display: grid; grid-template-columns: 1fr 320px; gap: 20px; }

  /* â"€â"€ RECENT COURSES TABLE â"€â"€ */
  .dash-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .dash-panel-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
  }
  .dash-panel-title { font-size: 14px; font-weight: 700; color: var(--text); }
  .dash-panel-link { font-size: 12px; font-weight: 500; color: var(--blue); text-decoration: none; }
  .dash-panel-link:hover { text-decoration: underline; }

  /* â"€â"€ ACTIVITY FEED â"€â"€ */
  .activity-feed { display: flex; flex-direction: column; }
  .activity-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-light);
  }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot {
    width: 8px; height: 8px; border-radius: 50%;
    margin-top: 5px; flex-shrink: 0;
  }
  .activity-dot.blue   { background: var(--blue); }
  .activity-dot.green  { background: var(--green); }
  .activity-dot.purple { background: var(--purple); }
  .activity-dot.amber  { background: var(--amber); }
  .activity-text { font-size: 13px; color: var(--text); line-height: 1.4; }
  .activity-time { font-size: 11px; color: var(--text-light); margin-top: 2px; }

  /* â"€â"€ STUDENT DASHBOARD â"€â"€ */
  .student-hero {
    background: linear-gradient(135deg, #1e3a5f 0%, #1d4ed8 100%);
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    margin-bottom: 28px;
    display: flex; align-items: center; gap: 20px;
    position: relative; overflow: hidden;
  }
  .student-hero::before {
    content: '';
    position: absolute; top: -40px; right: -40px;
    width: 200px; height: 200px; border-radius: 50%;
    background: rgba(255,255,255,0.06); pointer-events: none;
  }
  .student-hero-avatar {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 2px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; color: #fff;
    flex-shrink: 0; position: relative; z-index: 1;
  }
  .student-hero-text { position: relative; z-index: 1; }
  .student-hero-name { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: -0.4px; }
  .student-hero-sub  { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 3px; }

  /* â"€â"€ LECTURER DASHBOARD â"€â"€ */
  .lecturer-hero {
    background: linear-gradient(135deg, #134e4a 0%, #0d9488 100%);
    border-radius: var(--radius-lg);
    padding: 28px 32px;
    margin-bottom: 28px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    position: relative; overflow: hidden;
  }
  .lecturer-hero::before {
    content: '';
    position: absolute; top: -50px; right: -50px;
    width: 220px; height: 220px; border-radius: 50%;
    background: rgba(255,255,255,0.06); pointer-events: none;
  }
  .lecturer-hero-text { position: relative; z-index: 1; }
  .lecturer-hero-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
  .lecturer-hero-name { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: -0.4px; }
  .lecturer-hero-sub  { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 4px; }
  .lecturer-hero-action {
    display: flex; align-items: center; gap: 7px;
    padding: 10px 18px; border-radius: 10px;
    font-size: 13px; font-weight: 600; color: #fff;
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2);
    text-decoration: none; transition: all 0.15s; flex-shrink: 0; position: relative; z-index: 1;
  }
  .lecturer-hero-action:hover { background: rgba(255,255,255,0.25); }
  .lecturer-hero-action svg { width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round; }

  @media (max-width: 960px) {
    .admin-stats-grid { grid-template-columns: 1fr 1fr; }
    .admin-actions-grid { grid-template-columns: 1fr 1fr; }
    .dash-two-col { grid-template-columns: 1fr; }
    .admin-hero-actions { display: none; }
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title" id="dash-greeting">Dashboard</div>
        <div class="topbar-sub" id="dash-sub">Here's what's happening today</div>
      </div>
      <div class="topbar-right">
        <span class="topbar-semester">Fall Semester 2025</span>
        <span class="role-chip" id="tb-role-chip"></span>
        <a class="topbar-avatar-btn" href="/profile.html">
          <div class="user-avatar" id="tb-avatar">?</div>
          <span id="tb-username"></span>
        </a>
      </div>
    </header>

    <div class="page-content" id="dash-content">
      <div class="loading"><div class="spinner"></div> Loadingâ€¦</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="course-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="cm-title">Course</div>
      <button class="modal-close" onclick="closeModal('course-modal')">âœ•</button>
    </div>
    <div id="cm-body"></div>
  </div>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
<script>
  if (!requireAuth()) {}
  renderSidebar('dashboard');

  const role = CF.user?.role;
  const u    = CF.user;
  const initial = (u?.fname || u?.username || '?')[0].toUpperCase();

  document.getElementById('dash-greeting').textContent =
    role === 'admin'    ? 'Admin Console'  :
    role === 'lecturer' ? 'My Dashboard'   : 'My Dashboard';

  document.getElementById('dash-sub').textContent =
    role === 'admin'    ? 'System overview and management' :
    role === 'lecturer' ? 'Your courses and upcoming activity' :
                          'Your courses and upcoming events';

  async function loadDashboard() {
    const rc = await api('/courses');
    CF.courses = rc.ok ? rc.data : [];

    if (role === 'admin')    await renderAdmin();
    else if (role === 'lecturer') await renderLecturer();
    else                          await renderStudent();
  }

  /* â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
     ADMIN DASHBOARD
  â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• */
  async function renderAdmin() {
    const totalCourses = CF.courses.length;

    // fetch reports in parallel
    const [rStudents, rLecturers, rTop] = await Promise.all([
      api('/reports/students'),
      api('/reports/lecturers'),
      api('/reports/top-10-enrolled'),
    ]);

    const totalStudents  = rStudents.ok  ? rStudents.data.length  : 'â€"';
    const totalLecturers = rLecturers.ok ? rLecturers.data.length : 'â€"';
    const topCourses     = rTop.ok       ? rTop.data.slice(0, 5)  : [];

    // count unassigned courses
    const unassigned = CF.courses.filter(c => !c.lecturerID).length;

    const name = u?.fname ? `${u.fname} ${u.lname || ''}`.trim() : u?.username || 'Admin';

    document.getElementById('dash-content').innerHTML = `

      <!-- HERO -->
      <div class="admin-hero">
        <div class="admin-hero-text">
          <div class="admin-hero-eyebrow">Administrator</div>
          <div class="admin-hero-title">Welcome back, ${name}</div>
          <div class="admin-hero-sub">Full system access Â· Fall Semester 2025</div>
        </div>
        <div class="admin-hero-actions">
          <a class="admin-hero-btn primary" href="/admin.html">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            Admin Console
          </a>
          <a class="admin-hero-btn secondary" href="/courses.html">
            <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            All Courses
          </a>
        </div>
      </div>

      <!-- STATS -->
      <div class="admin-stats-grid">
        <div class="admin-stat">
          <div class="admin-stat-top">
            <span class="admin-stat-label">Total Courses</span>
            <div class="admin-stat-icon blue">
              <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </div>
          </div>
          <div class="admin-stat-value">${totalCourses}</div>
          <div class="admin-stat-sub">${unassigned} unassigned</div>
          <div class="admin-stat-accent blue"></div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-top">
            <span class="admin-stat-label">Students</span>
            <div class="admin-stat-icon green">
              <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
          </div>
          <div class="admin-stat-value">${totalStudents}</div>
          <div class="admin-stat-sub">In 5+ courses</div>
          <div class="admin-stat-accent green"></div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-top">
            <span class="admin-stat-label">Lecturers</span>
            <div class="admin-stat-icon purple">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/><path d="M12 12v9"/><path d="M9 15l3-3 3 3"/></svg>
            </div>
          </div>
          <div class="admin-stat-value">${totalLecturers}</div>
          <div class="admin-stat-sub">Teaching 3+ courses</div>
          <div class="admin-stat-accent purple"></div>
        </div>
        <div class="admin-stat">
          <div class="admin-stat-top">
            <span class="admin-stat-label">Unassigned</span>
            <div class="admin-stat-icon amber">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            </div>
          </div>
          <div class="admin-stat-value">${unassigned}</div>
          <div class="admin-stat-sub">${unassigned > 0 ? 'Needs a lecturer' : 'All assigned'}</div>
          <div class="admin-stat-accent amber"></div>
        </div>
      </div>

      <!-- QUICK ACTIONS -->
      <div class="section-header" style="margin-bottom:14px">
        <div class="section-title">Quick Actions</div>
      </div>
      <div class="admin-actions-grid" style="margin-bottom:28px">
        <a class="admin-action-card" href="/admin.html">
          <div class="admin-action-icon blue">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </div>
          <div class="admin-action-title">System Reports</div>
          <div class="admin-action-desc">View enrollment and performance analytics</div>
        </a>
        <a class="admin-action-card" href="/admin.html" onclick="sessionStorage.setItem('adminTab','create')">
          <div class="admin-action-icon green">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          </div>
          <div class="admin-action-title">Create Course</div>
          <div class="admin-action-desc">Add a new course to the catalog</div>
        </a>
        <a class="admin-action-card" href="/admin.html" onclick="sessionStorage.setItem('adminTab','mgmt')">
          <div class="admin-action-icon purple">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="admin-action-title">Assign Lecturers</div>
          <div class="admin-action-desc">Manage course lecturer assignments</div>
        </a>
        <a class="admin-action-card" href="/courses.html">
          <div class="admin-action-icon amber">
            <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          </div>
          <div class="admin-action-title">Browse Courses</div>
          <div class="admin-action-desc">View the full course catalog</div>
        </a>
      </div>

      <!-- BOTTOM TWO COL -->
      <div class="dash-two-col">
        <!-- TOP ENROLLED COURSES -->
        <div class="dash-panel">
          <div class="dash-panel-header">
            <div class="dash-panel-title">Top Enrolled Courses</div>
            <a class="dash-panel-link" href="/admin.html">View reports</a>
          </div>
          ${topCourses.length ? `
          <table>
            <thead><tr><th>Code</th><th>Course</th><th style="text-align:right">Students</th></tr></thead>
            <tbody>${topCourses.map(c => `
              <tr>
                <td><strong>${c.ccode}</strong></td>
                <td>${c.cname}</td>
                <td style="text-align:right"><span class="badge badge-blue">${c.student_count}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>` : '<div class="empty-state" style="padding:24px"><p>No data</p></div>'}
        </div>

        <!-- UNASSIGNED COURSES -->
        <div class="dash-panel">
          <div class="dash-panel-header">
            <div class="dash-panel-title">Needs Lecturer</div>
            <a class="dash-panel-link" href="/admin.html">Assign</a>
          </div>
          <div class="activity-feed">
            ${CF.courses.filter(c => !c.lecturerID).slice(0, 6).map(c => `
              <div class="activity-item">
                <div class="activity-dot amber"></div>
                <div>
                  <div class="activity-text"><strong>${c.ccode}</strong> â€" ${c.cname}</div>
                  <div class="activity-time">No lecturer assigned</div>
                </div>
