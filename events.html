<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CourseFlow — Schedule</title>
<link rel="stylesheet" href="/styles.css" />
<style>
  .event-card { transition: box-shadow 0.15s, transform 0.15s; }
  .event-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }

  /* ── COURSE PICKER EMPTY STATE ── */
  .picker-hero {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 56px 32px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 20px;
    box-shadow: var(--shadow-sm);
  }
  .picker-hero-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--blue-light);
    display: flex; align-items: center; justify-content: center;
  }
  .picker-hero-icon svg { width: 30px; height: 30px; stroke: var(--blue); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .picker-hero-title { font-size: 18px; font-weight: 800; color: var(--text); }
  .picker-hero-sub { font-size: 13px; color: var(--text-muted); max-width: 320px; line-height: 1.6; }
  .picker-hero-select {
    width: 100%; max-width: 380px;
    padding: 12px 16px; font-size: 14px; font-weight: 500;
    border: 1.5px solid var(--border); border-radius: var(--radius);
    background: var(--bg); color: var(--text);
    outline: none; cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .picker-hero-select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(37,99,235,0.08); }

  /* ── ACTIVE HEADER BAR ── */
  .active-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 20px;
  }
  .active-bar-back {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--radius-sm);
    border: 1.5px solid var(--border); background: var(--surface);
    font-size: 13px; font-weight: 600; color: var(--text-muted);
    cursor: pointer; text-decoration: none; transition: all 0.13s;
  }
  .active-bar-back:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
  .active-bar-back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }
  .active-bar-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .active-bar-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .active-bar-filters { display: flex; gap: 8px; align-items: center; margin-left: auto; }
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-title">Schedule</div>
        <div class="topbar-sub">View and manage calendar events</div>
      </div>
      <div class="topbar-right">
        <span class="role-chip" id="tb-role-chip"></span>
        <a class="topbar-avatar-btn" href="/profile.html">
          <div class="user-avatar" id="tb-avatar">?</div>
          <span id="tb-username"></span>
        </a>
      </div>
    </header>

    <div class="page-content">

      <!-- Empty state: pick a course -->
      <div id="picker-state">
        <div class="picker-hero">
          <div class="picker-hero-icon">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          </div>
          <div>
            <div class="picker-hero-title">View your Schedule</div>
            <div class="picker-hero-sub">Pick a course below to see its calendar events, or browse all your events by date.</div>
          </div>
          <select class="picker-hero-select" id="event-course-select" onchange="onCourseSelect()">
            <option value="">— Select a course —</option>
          </select>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center">
            <input type="date" class="picker-hero-select" id="event-date-filter" style="max-width:200px" />
            <button class="btn btn-primary" onclick="onCourseSelect()">Load Events</button>
          </div>
        </div>
      </div>

      <!-- Active state: showing events -->
      <div id="active-state" style="display:none">
        <div class="active-bar">
          <button class="active-bar-back" onclick="resetToPickerState()">
            <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
            Back
          </button>
          <div>
            <div class="active-bar-title" id="active-bar-title">Events</div>
            <div class="active-bar-sub" id="active-bar-sub"></div>
          </div>
          <div class="active-bar-filters">
            <input type="date" class="form-input" id="active-date-filter" style="width:auto;font-size:13px" onchange="applyDateFilter()" />
            <button class="btn btn-outline btn-sm lecturer-only" style="display:none" onclick="showCreateEventModal()">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Event
            </button>
          </div>
        </div>
        <div id="events-list"></div>
      </div>

    </div>
  </div>
</div>

<div class="modal-overlay" id="create-event-modal">
  <div class="modal" style="width:480px">
    <div class="modal-header">
      <div class="modal-title">Create Calendar Event</div>
      <button class="modal-close" onclick="closeModal('create-event-modal')">✕</button>
    </div>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input class="form-input" id="ev-title" type="text" placeholder="Event title" />
    </div>
    <div class="form-group">
      <label class="form-label">Description</label>
      <textarea class="form-textarea" id="ev-desc" placeholder="Optional description…" style="min-height:70px"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="form-input" id="ev-date" type="date" />
      </div>
      <div class="form-group">
        <label class="form-label">Start Time</label>
        <input class="form-input" id="ev-start" type="time" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">End Time</label>
      <input class="form-input" id="ev-end" type="time" />
    </div>
    <button class="btn btn-primary w-full mt-8" style="justify-content:center" onclick="createEvent()">Create Event</button>
  </div>
</div>

<div id="toast"></div>
<script src="/app.js"></script>
<script>
  if (!requireAuth()) {}
  renderSidebar('events');
  if (CF.user?.role === 'lecturer' || CF.user?.role === 'admin') {
    document.querySelectorAll('.lecturer-only').forEach(el => el.style.display = '');
  }

  let allEvents = [], activeCourseID = null;

  async function init() {
    let courses = [];
    if (CF.user?.role === 'student') {
      const rm = await api(`/courses/student/${CF.user.userID}`);
      courses = rm.ok ? rm.data : [];
    } else {
      const rc = await api('/courses');
      courses = rc.ok ? rc.data : [];
    }
    CF.courses = courses;

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('event-date-filter').value = today;
    document.getElementById('active-date-filter').value = today;

    const sel = document.getElementById('event-course-select');
    sel.innerHTML = '<option value="">— Select a course —</option>' +
      courses.map(c => `<option value="${c.courseID}">${c.ccode} — ${c.cname}</option>`).join('');
  }

  async function onCourseSelect() {
    const courseID = document.getElementById('event-course-select').value;
    const date     = document.getElementById('event-date-filter').value;
    activeCourseID = courseID || null;

    document.getElementById('picker-state').style.display = 'none';
    document.getElementById('active-state').style.display = '';
    document.getElementById('active-date-filter').value = date;

    const course = CF.courses.find(c => String(c.courseID) === String(courseID));
    document.getElementById('active-bar-title').textContent = course ? `${course.ccode} — ${course.cname}` : 'All Enrolled Courses';
    document.getElementById('active-bar-sub').textContent = date ? `Filtered to ${new Date(date + 'T00:00:00').toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'})}` : 'All upcoming events';

    await loadEvents(courseID, date);
  }

  function resetToPickerState() {
    document.getElementById('active-state').style.display = 'none';
    document.getElementById('picker-state').style.display = '';
    document.getElementById('event-course-select').value = '';
    activeCourseID = null;
  }

  function applyDateFilter() {
    const date = document.getElementById('active-date-filter').value;
    const sub  = date ? `Filtered to ${new Date(date + 'T00:00:00').toLocaleDateString('en-US', {month:'long',day:'numeric',year:'numeric'})}` : 'All upcoming events';
    document.getElementById('active-bar-sub').textContent = sub;
    renderEvents(date ? allEvents.filter(e => e.event_date === date) : allEvents);
  }

  async function loadEvents(courseID, date) {
    const el = document.getElementById('events-list');
    el.innerHTML = '<div class="loading"><div class="spinner"></div> Loading…</div>';

    allEvents = [];
    if (courseID) {
      const r = await api(`/courses/${courseID}/events`);
      allEvents = r.ok ? r.data : [];
    } else if (date && CF.user?.role === 'student') {
      const r = await api(`/students/${CF.user.userID}/events?date=${date}`);
      allEvents = r.ok ? r.data : [];
    } else {
      for (const c of CF.courses.slice(0, 5)) {
        const r = await api(`/courses/${c.courseID}/events`);
        if (r.ok) allEvents.push(...r.data.map(e => ({...e, _cname: c.cname, _ccode: c.ccode})));
      }
    }

    allEvents.sort((a, b) => new Date(a.event_date) - new Date(b.event_date));
    renderEvents(date ? allEvents.filter(e => e.event_date === date) : allEvents);
  }

  function renderEvents(events) {
    const el = document.getElementById('events-list');
    if (!events.length) { el.innerHTML = '<div class="empty-state"><p>No events found</p></div>'; return; }
    el.innerHTML = events.map(e => {
      const d       = new Date(e.event_date + 'T00:00:00');
      const month   = d.toLocaleString('default', { month: 'short' }).toUpperCase();
      const day     = d.getDate();
      const course  = e._cname ? `${e._ccode} — ${e._cname}` : '';
      const timeStr = e.start_time ? `${e.start_time}${e.end_time ? ' – ' + e.end_time : ''}` : '';
      return `
      <div class="event-card">
        <div class="event-date-block">
          <div class="event-month">${month}</div>
          <div class="event-day">${day}</div>
        </div>
        <div class="event-info">
          <div class="event-title">${e.title}</div>
          ${course   ? `<div class="event-course">${course}</div>` : ''}
          ${timeStr  ? `<div class="event-time">${timeStr}</div>` : ''}
          ${e.description ? `<div style="font-size:12px;color:var(--text-muted);margin-top:3px">${e.description}</div>` : ''}
        </div>
      </div>`;
    }).join('');
  }

  function showCreateEventModal() {
    if (!activeCourseID) return toast('Please select a course first', 'error');
    openModal('create-event-modal');
  }

  async function createEvent() {
    if (!activeCourseID) return;
    const body = {
      title:       document.getElementById('ev-title').value.trim(),
      description: document.getElementById('ev-desc').value.trim(),
      event_date:  document.getElementById('ev-date').value,
      start_time:  document.getElementById('ev-start').value || null,
      end_time:    document.getElementById('ev-end').value   || null,
    };
    if (!body.title || !body.event_date) return toast('Title and date are required', 'error');
    const r = await api(`/courses/${activeCourseID}/events`, { method: 'POST', body: JSON.stringify(body) });
    toast(r.data.message || (r.ok ? 'Event created!' : 'Failed'), r.ok ? 'success' : 'error');
    if (r.ok) { closeModal('create-event-modal'); loadEvents(activeCourseID, document.getElementById('active-date-filter').value); }
  }

  init();
</script>
</body>
</html>
